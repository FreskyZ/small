const allLanguagesElement = document.querySelector('div#all-languages');

function createSVGElement(pathData) {
  const element = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  element.setAttribute('viewBox', '0 0 1024 1024');
  element.setAttribute('width', '28px');
  element.setAttribute('height', '28px');
  element.setAttribute('stroke', '#eee');
  element.setAttribute('stroke-width', '72');
  element.setAttribute('fill', 'none');
  const pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  pathElement.setAttribute('d', pathData);
  element.append(pathElement);
  return element;
}

function render() {
  for (const languageData of AllLanguageData) {
    const languageContainerElement = document.createElement('div');
    languageContainerElement.classList.add('language-container');
    const languageNameElement = document.createElement('div');
    languageNameElement.classList.add('language-name');
    languageNameElement.innerText = `LANGUAGE: ${languageData.name}`;
    languageContainerElement.appendChild(languageNameElement);
    for (const groupData of languageData.characterGroups) {
      const groupContainerElement = document.createElement('div');
      groupContainerElement.classList.add('group-container');
      const groupNameElement = document.createElement('div');
      groupNameElement.classList.add('group-name');
      groupNameElement.innerText = `GROUP ${groupData.name}`;
      groupContainerElement.appendChild(groupNameElement);
      for (const charData of groupData.characters) {
        const charContainerElement = document.createElement('span');
        charContainerElement.classList.add('char-container');
        charContainerElement.dataset['id'] = charData.name;
        charContainerElement.appendChild(createSVGElement(charData.path));
        const charNameElement = document.createElement('span');
        charNameElement.classList.add('char-name');
        charNameElement.innerText = charData.name;
        charContainerElement.title = charData.desc;
        charContainerElement.appendChild(charNameElement);
        groupContainerElement.appendChild(charContainerElement);
      }
      languageContainerElement.appendChild(groupContainerElement);
    }
    for (const exampleData of languageData.sentences) {
      const exampleContainerElement = document.createElement('div');
      exampleContainerElement.classList.add('example-container');
      for (const charName of exampleData.characters) {
        const charData = languageData.characterGroups.flatMap(g => g.characters).find(c => c.name == charName);
        const charContainerElement = document.createElement('span');
        charContainerElement.classList.add('char-container');
        charContainerElement.dataset['id'] = charData?.name;
        charContainerElement.appendChild(createSVGElement(charData?.path));
        const charNameElement = document.createElement('span');
        charNameElement.classList.add('char-name');
        charNameElement.innerText = charData?.name;
        charContainerElement.title = charData?.desc;
        charContainerElement.appendChild(charNameElement);
        exampleContainerElement.appendChild(charContainerElement);
      }
      const descriptionElement = document.createElement('span');
      descriptionElement.classList.add('example-description');
      descriptionElement.innerText = `${exampleData.desc} (${exampleData.context})`;
      exampleContainerElement.appendChild(descriptionElement);
      languageContainerElement.appendChild(exampleContainerElement);
    }
    allLanguagesElement.appendChild(languageContainerElement);
  }
}

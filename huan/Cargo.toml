[package]
name = "huan"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["full"] }
